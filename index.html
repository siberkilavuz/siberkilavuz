<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesaj</title>
  <style>
    /* Arka plan ve genel stil */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Arial', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(45deg, #000000, #333333, #444444);
      background-size: 400% 400%;
      animation: gradientAnimation 10s ease infinite;
    }

    /* Mesaj yazısının stili */
    #mesaj {
      font-size: 5em;
      font-weight: bold;
      color: white;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 5px;
      opacity: 0;
      animation: fadeIn 3s forwards;
      animation-delay: 1s; /* 1 saniye bekleyip mesajı göster */
    }

    /* Arka plan animasyonu */
    @keyframes gradientAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Yazı fade-in animasyonu */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

  </style>
</head>
<body>
  <div id="mesaj">Panelciler siberci değildir</div>
</body>
</html>
