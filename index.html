<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SiberKılavuz Username Bulucu</title>
    <script src="https://cdn.jsdelivr.net/npm/brython@3/brython.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/brython@3/brython_stdlib.js"></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        body {
            background-color: #1e1e1e;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 40px;
        }
        input, button {
            padding: 10px;
            font-size: 18px;
            margin: 10px;
            border-radius: 5px;
        }
        table {
            margin-top: 20px;
            border-collapse: collapse;
            width: 80%;
            margin: 0 auto;
        }
        th, td {
            padding: 12px;
            border: 1px solid #555;
        }
        th {
            background-color: #333;
        }
        a {
            color: #00ff99;
            text-decoration: none;
        }
        .social-links {
            margin-top: 30px;
        }
        #recaptcha_msg {
            color: red;
            font-size: 16px;
        }
        #results {
            display: none;  /* Arama sonuçları başlangıçta gizli */
        }
    </style>
</head>
<body onload="brython()">
    <h1>🔎 SiberKılavuz Username Bulucu</h1>

    <!-- Arama çubuğu ve butonları -->
    <input id="kullanici" type="text" placeholder="Kullanıcı adı girin">
    <button id="tara_btn" onclick="ara()">Tara</button>

    <!-- reCAPTCHA widget (başlangıçta gizli olacak) -->
    <div id="recaptcha" style="display: none;">
        <div class="g-recaptcha" data-sitekey="6LdJjYArAAAAALWI_liYtr6sV1i0zfPBYjbvn87B"></div>
        <button id="verify_btn" onclick="verifyCaptcha()">Doğrulama Yap</button>
    </div>

    <div id="results"></div>

    <div class="social-links">
        <p>🎥 Bizi takip et:</p>
        <a href="https://www.instagram.com/siberkilavuz/#" target="_blank">Instagram</a> | 
        <a href="https://www.youtube.com/@Siberk%C4%B1lavuz" target="_blank">YouTube</a>
    </div>

    <div id="recaptcha_msg"></div>

    <script>
        // JavaScript kısmı - reCAPTCHA işlemleri için
        function ara() {
            const kullaniciAdi = document.getElementById("kullanici").value.trim();
            const sonucDiv = document.getElementById("results");
            sonucDiv.innerHTML = '';

            if (!kullaniciAdi) {
                alert("Kullanıcı adı boş olamaz!");
                return;
            }

            document.getElementById("recaptcha").style.display = "block";
            document.getElementById("recaptcha_msg").innerHTML = "Lütfen robot doğrulamasını tamamlayın.";
        }

        function verifyCaptcha() {
            if (grecaptcha.getResponse()) {
                document.getElementById("recaptcha_msg").innerHTML = "Doğrulama başarılı! Arama sonuçları gösteriliyor...";
                showResults();
            } else {
                document.getElementById("recaptcha_msg").innerHTML = "Doğrulama başarısız, lütfen tekrar deneyin.";
            }
        }

        function showResults() {
            const kullaniciAdi = document.getElementById("kullanici").value.trim();
            const sonucDiv = document.getElementById("results");
            sonucDiv.innerHTML = '';

            // Brython fonksiyonunu çağır
            window.showBrythonResults(kullaniciAdi, sonucDiv);
        }
    </script>

    <script type="text/python">
        from browser import document, html, alert
        import time

        # 50'den fazla sosyal medya platformu eklendi
        platforms = {
            "GitHub": "https://github.com/{}",
            "Instagram": "https://instagram.com/{}",
            "Twitter": "https://twitter.com/{}",
            "Reddit": "https://www.reddit.com/user/{}",
            "TikTok": "https://tiktok.com/@{}",
            "Facebook": "https://www.facebook.com/{}",
            "LinkedIn": "https://www.linkedin.com/in/{}",
            "Pinterest": "https://www.pinterest.com/{}",
            "YouTube": "https://www.youtube.com/@{}",
            "Snapchat": "https://www.snapchat.com/add/{}",
            "Spotify": "https://open.spotify.com/user/{}",
            "Tumblr": "https://{}.tumblr.com",
            "SoundCloud": "https://soundcloud.com/{}",
            "Medium": "https://medium.com/@{}",
            "Quora": "https://www.quora.com/profile/{}",
            "StackOverflow": "https://stackoverflow.com/users/{}",
            "Flickr": "https://www.flickr.com/photos/{}",
            "Vimeo": "https://vimeo.com/{}",
            "Steam": "https://steamcommunity.com/id/{}",
            "Discord": "https://discord.com/users/{}",
            "Twitch": "https://www.twitch.tv/{}",
            "Periscope": "https://www.pscp.tv/{}",
            "DeviantArt": "https://www.deviantart.com/{}",
            "Behance": "https://www.behance.net/{}",
            "Dribbble": "https://dribbble.com/{}",
            "Foursquare": "https://foursquare.com/user/{}",
            "Trello": "https://trello.com/{}",
            "Skype": "https://join.skype.com/invite/{}",
            "GitLab": "https://gitlab.com/{}",
            "Kik": "https://kik.com/{}",
            "Yelp": "https://www.yelp.com/user_details?userid={}",
            "WeChat": "https://web.wechat.com/{}",
            "Line": "https://line.me/ti/p/{}",
            "Viber": "https://www.viber.com/{}",
            "WhatsApp": "https://wa.me/{}",
            "Slack": "https://slack.com/{}",
            "Zalo": "https://zalo.me/{}",
            "Badoo": "https://badoo.com/en/{}",
            "Coub": "https://coub.com/{}",
            "MySpace": "https://myspace.com/{}",
            "Mix": "https://mix.com/{}",
            "Joomla": "https://www.joomla.org/user/{}",
            "Meetup": "https://www.meetup.com/members/{}",
            "Disqus": "https://disqus.com/by/{}",
            "Picasa": "https://picasaweb.google.com/{}",
            "Gravatar": "https://www.gravatar.com/{}",
            "Blogger": "https://www.blogger.com/profile/{}",
            "Redbubble": "https://www.redbubble.com/people/{}",
            "Vero": "https://www.vero.co/{}",
            "Mastodon": "https://mastodon.social/@{}",
            "PeerTube": "https://{}/videos",
            "LiveJournal": "https://{}/profile"
        }

        # Zaman Damgası ve Arama Limiti
        user_searches = {}

        def showBrythonResults(username, result_div):
            # Arama Limiti Kontrolü
            user_id = "default_user"
            current_time = time.time()

            if user_id in user_searches:
                last_search_time, search_count = user_searches[user_id]
                if current_time - last_search_time < 10:
                    if search_count >= 2:
                        alert("10 saniyede yalnızca 2 arama yapabilirsiniz!")
                        return
                    else:
                        user_searches[user_id] = (current_time, search_count + 1)
                else:
                    user_searches[user_id] = (current_time, 1)
            else:
                user_searches[user_id] = (current_time, 1)

            result_div <= html.H3(f"{username} için demo linkleri:")

            # Tabloyu oluşturuyoruz
            tablo = html.TABLE()
            tablo <= html.TR() <= html.TH("Platform") + html.TH("Bağlantı")

            for isim, url in platforms.items():
                tam_url = url.format(username)
                satır = html.TR()
                satır <= html.TD(isim) + html.TD(html.A("Link", href=tam_url, target="_blank"))
                tablo <= satır

            result_div <= tablo
            document["results"].style.display = "block"  # Sonuçları görünür yap

        # Brython fonksiyonunu global yapıyoruz
        window.showBrythonResults = showBrythonResults

        # Enter tuşu desteği
        def on_key_press(ev):
            if ev.keyCode == 13:
                ara()

        document["kullanici"].bind("keypress", on_key_press)
    </script>
</body>
</html>
