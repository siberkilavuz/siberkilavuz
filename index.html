<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SiberKılavuz Username Bulucu</title>
    <script src="https://cdn.jsdelivr.net/npm/brython@3/brython.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/brython@3/brython_stdlib.js"></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        body {
            background-color: #1e1e1e;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 40px;
        }
        input, button {
            padding: 10px;
            font-size: 18px;
            margin: 10px;
            border-radius: 5px;
        }
        table {
            margin-top: 20px;
            border-collapse: collapse;
            width: 80%;
            margin: 0 auto;
        }
        th, td {
            padding: 12px;
            border: 1px solid #555;
        }
        th {
            background-color: #333;
        }
        a {
            color: #00ff99;
            text-decoration: none;
        }
        .social-links {
            margin-top: 30px;
        }
        #recaptcha_msg {
            color: red;
            font-size: 16px;
        }
        #results {
            display: none;
            margin-top: 20px;
        }
        .g-recaptcha {
            display: inline-block;
            margin: 15px 0;
        }
    </style>
</head>
<body onload="brython()">
    <h1>🔎 SiberKılavuz Username Bulucu</h1>

    <input id="kullanici" type="text" placeholder="Kullanıcı adı girin">
    <button id="tara_btn" onclick="startSearch()">Tara</button>

    <div id="recaptcha" style="display: none;">
        <div class="g-recaptcha" data-sitekey="6LdJjYArAAAAALWI_liYtr6sV1i0zfPBYjbvn87B" data-callback="onCaptchaSuccess"></div>
        <div id="recaptcha_msg"></div>
    </div>

    <div id="results"></div>

    <div class="social-links">
        <p>🎥 Bizi takip et:</p>
        <a href="https://www.instagram.com/siberkilavuz/#" target="_blank">Instagram</a> | 
        <a href="https://www.youtube.com/@Siberk%C4%B1lavuz" target="_blank">YouTube</a>
    </div>

    <script>
        // Global değişkenler
        let currentUsername = '';
        
        // Arama başlatma fonksiyonu
        function startSearch() {
            currentUsername = document.getElementById("kullanici").value.trim();
            if (!currentUsername) {
                alert("Kullanıcı adı boş olamaz!");
                return;
            }
            document.getElementById("recaptcha").style.display = "block";
            document.getElementById("recaptcha_msg").textContent = "Lütfen robot doğrulamasını tamamlayın.";
        }
        
        // reCAPTCHA başarılı olduğunda çağrılır
        function onCaptchaSuccess() {
            document.getElementById("recaptcha_msg").textContent = "Doğrulama başarılı! Arama yapılıyor...";
            // Brython fonksiyonunu çağır
            window.showResults(currentUsername);
        }
    </script>

    <script type="text/python">
        from browser import document, html, window, alert
        import time

        platforms = {
            "GitHub": "https://github.com/{}",
            "Instagram": "https://instagram.com/{}",
            "Twitter": "https://twitter.com/{}",
            "Reddit": "https://www.reddit.com/user/{}",
            "TikTok": "https://tiktok.com/@{}",
            "Facebook": "https://www.facebook.com/{}",
            "LinkedIn": "https://www.linkedin.com/in/{}",
            "Pinterest": "https://www.pinterest.com/{}",
            "YouTube": "https://www.youtube.com/@{}",
            "Snapchat": "https://www.snapchat.com/add/{}",
            "Spotify": "https://open.spotify.com/user/{}",
            "Tumblr": "https://{}.tumblr.com",
            "SoundCloud": "https://soundcloud.com/{}",
            "Medium": "https://medium.com/@{}",
            "Quora": "https://www.quora.com/profile/{}",
            "StackOverflow": "https://stackoverflow.com/users/{}",
            "Flickr": "https://www.flickr.com/photos/{}",
            "Vimeo": "https://vimeo.com/{}",
            "Steam": "https://steamcommunity.com/id/{}",
            "Discord": "https://discord.com/users/{}",
            "Twitch": "https://www.twitch.tv/{}"
        }

        user_searches = {}

        def showResults(username):
            # Arama limit kontrolü
            current_time = time.time()
            if "last_search" in user_searches:
                last_time, count = user_searches["last_search"]
                if current_time - last_time < 10 and count >= 2:
                    alert("10 saniyede en fazla 2 arama yapabilirsiniz!")
                    return
                user_searches["last_search"] = (current_time, count + 1)
            else:
                user_searches["last_search"] = (current_time, 1)

            # Sonuçları oluştur
            results_div = document["results"]
            results_div.innerHTML = ""
            results_div.style.display = "block"

            title = html.H3(f"{username} için bulunan platformlar:")
            results_div <= title

            table = html.TABLE()
            table <= html.TR(html.TH("Platform") + html.TH("Bağlantı"))

            for platform, url in platforms.items():
                full_url = url.format(username)
                row = html.TR(
                    html.TD(platform) + 
                    html.TD(html.A("Profil linki", href=full_url, target="_blank"))
                table <= row

            results_div <= table

        # Brython fonksiyonunu global olarak erişilebilir yap
        window.showResults = showResults

        # Enter tuşu desteği
        def on_key_press(ev):
            if ev.key == "Enter":
                window.startSearch()

        document["kullanici"].bind("keypress", on_key_press)
    </script>
</body>
</html>
