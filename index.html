<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobil Mesaj</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .mesaj {
      font-size: 8vw;
      font-weight: bold;
      letter-spacing: 2px;
    }

    /* Sadece mobil cihazlar için geçerli */
    @media (min-width: 601px) {
      body {
        display: none; /* Telefon dışı cihazlarda hiçbir şey gösterme */
      }
    }
  </style>
</head>
<body>
  <div class="mesaj">👨‍🦱Beni affeder misin? </div>
</body>
</html>
