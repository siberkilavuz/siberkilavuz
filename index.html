<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SiberKılavuz Username Bulucu</title>
    <script src="https://cdn.jsdelivr.net/npm/brython@3/brython.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/brython@3/brython_stdlib.js"></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        body {
            background-color: #1e1e1e;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 40px;
            display: none; /* Başlangıçta tüm sayfa gizli */
        }
        #captcha-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        #captcha-msg {
            color: white;
            margin-bottom: 20px;
            font-size: 18px;
        }
        input, button {
            padding: 10px;
            font-size: 18px;
            margin: 10px;
            border-radius: 5px;
        }
        table {
            margin-top: 20px;
            border-collapse: collapse;
            width: 80%;
            margin: 0 auto;
        }
        th, td {
            padding: 12px;
            border: 1px solid #555;
        }
        th {
            background-color: #333;
        }
        a {
            color: #00ff99;
            text-decoration: none;
        }
        .social-links {
            margin-top: 30px;
        }
        #recaptcha_msg {
            color: red;
            font-size: 16px;
        }
        #results {
            display: none;
            margin-top: 20px;
        }
        .g-recaptcha {
            display: inline-block;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <!-- reCAPTCHA Doğrulama Alanı -->
    <div id="captcha-container">
        <div id="captcha-msg">Lütfen robot olmadığınızı doğrulayın</div>
        <div class="g-recaptcha" data-sitekey="6LdJjYArAAAAALWI_liYtr6sV1i0zfPBYjbvn87B" data-callback="onCaptchaSuccess"></div>
    </div>

    <!-- Ana İçerik (Başlangıçta Gizli) -->
    <div id="main-content" style="display: none;">
        <h1>🔎 SiberKılavuz Username Bulucu</h1>

        <input id="kullanici" type="text" placeholder="Kullanıcı adı girin">
        <button id="tara_btn">Tara</button>

        <div id="results"></div>

        <div class="social-links">
            <p>🎥 Bizi takip et:</p>
            <a href="https://www.instagram.com/siberkilavuz/#" target="_blank">Instagram</a> | 
            <a href="https://www.youtube.com/@Siberk%C4%B1lavuz" target="_blank">YouTube</a>
        </div>

        <div id="recaptcha_msg"></div>
    </div>

    <script>
        // reCAPTCHA başarılı olduğunda çağrılır
        function onCaptchaSuccess() {
            document.getElementById("captcha-container").style.display = "none";
            document.getElementById("main-content").style.display = "block";
            // Brython'u başlat
            brython();
        }

        // Sayfa yüklendiğinde sadece captcha göster
        window.onload = function() {
            document.getElementById("captcha-container").style.display = "block";
        };
    </script>

    <script type="text/python">
        from browser import document, html, alert
        import time

        platforms = {
            "GitHub": "https://github.com/{}",
            "Instagram": "https://instagram.com/{}",
            "Twitter": "https://twitter.com/{}",
            "Reddit": "https://www.reddit.com/user/{}",
            "TikTok": "https://tiktok.com/@{}",
            "Facebook": "https://www.facebook.com/{}",
            "LinkedIn": "https://www.linkedin.com/in/{}",
            "Pinterest": "https://www.pinterest.com/{}",
            "YouTube": "https://www.youtube.com/@{}",
            "Snapchat": "https://www.snapchat.com/add/{}",
            "Spotify": "https://open.spotify.com/user/{}",
            "Tumblr": "https://{}.tumblr.com",
            "SoundCloud": "https://soundcloud.com/{}",
            "Medium": "https://medium.com/@{}",
            "Quora": "https://www.quora.com/profile/{}",
            "StackOverflow": "https://stackoverflow.com/users/{}",
            "Flickr": "https://www.flickr.com/photos/{}",
            "Vimeo": "https://vimeo.com/{}",
            "Steam": "https://steamcommunity.com/id/{}",
            "Discord": "https://discord.com/users/{}",
            "Twitch": "https://www.twitch.tv/{}"
        }

        user_searches = {}

        def ara(event=None):
            kullanici_adi = document["kullanici"].value.strip()
            sonuc_div = document["results"]
            sonuc_div.clear()

            if not kullanici_adi:
                alert("Kullanıcı adı boş olamaz!")
                return

            # Arama limit kontrolü
            current_time = time.time()
            if "last_search" in user_searches:
                last_time, count = user_searches["last_search"]
                if current_time - last_time < 10 and count >= 2:
                    alert("10 saniyede en fazla 2 arama yapabilirsiniz!")
                    return
                user_searches["last_search"] = (current_time, count + 1)
            else:
                user_searches["last_search"] = (current_time, 1)

            # Sonuçları göster
            sonuc_div <= html.H3(f"{kullanici_adi} için bulunan platformlar:")

            tablo = html.TABLE()
            tablo <= html.TR(html.TH("Platform") + html.TH("Bağlantı"))

            for platform, url in platforms.items():
                tam_url = url.format(kullanici_adi)
                satir = html.TR(
                    html.TD(platform) + 
                    html.TD(html.A("Profil linki", href=tam_url, target="_blank"))
                tablo <= satir

            sonuc_div <= tablo
            sonuc_div.style.display = "block"

        # Buton ve klavye olaylarını bağla
        document["tara_btn"].bind("click", ara)
        document["kullanici"].bind("keypress", lambda ev: ara() if ev.key == "Enter" else None)
    </script>
</body>
</html>
