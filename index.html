<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beni Affeder Misin?</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #fff0f0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    h1 {
      color: #e63946;
      font-size: 2em;
      margin-bottom: 40px;
    }

    .buttons {
      display: flex;
      gap: 20px;
    }

    button {
      padding: 15px 30px;
      font-size: 1.2em;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .yes {
      background-color: #38b000;
      color: white;
    }

    .no {
      background-color: #d00000;
      color: white;
    }
  </style>
</head>
<body>

  <h1>Beni affeder misin?</h1>

  <div class="buttons">
    <button class="yes">Evet</button>
    <button class="no">Hayır</button>
  </div>

  <script>
    const yesBtn = document.querySelector('.yes');
    const noBtn = document.querySelector('.no');

    noBtn.addEventListener('click', () => {
      noBtn.style.display = 'none';
      yesBtn.style.transform = 'scale(1.5)';
    });

    yesBtn.addEventListener('click', () => {
      document.body.innerHTML = '<h1 style="color:green;">Teşekkür ederim 💖</h1>';
    });
  </script>

</body>
</html>
